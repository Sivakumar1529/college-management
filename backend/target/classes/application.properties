# Server
server.port=8080

# Database Configuration
# Default local profile uses an in-memory H2 database so the app can run without a MySQL installation.
# To use MySQL instead, switch the datasource to the commented MySQL settings below and remove the H2 config.
spring.datasource.url=jdbc:h2:mem:college_mgmt_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# MySQL config (uncomment if you want to connect to a real MySQL instance)
# spring.datasource.url=jdbc:mysql://localhost:3306/college_mgmt_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
app.jwt.secret=CollegeManagementSystemSecretKey2024VeryLongSecretKeyForHS256Algorithm
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.college.management=DEBUG
